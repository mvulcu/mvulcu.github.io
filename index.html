<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://grepme.dev">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maria Vulcu | DevOps & Cloud Engineering Hub</title>
  <link rel="canonical" href="https://grepme.dev">
  <meta name="description" content="DevOps / Cloud Engineer portfolio and technical documentation gateway.">
  <script>
    window.location.replace("https://grepme.dev");
  </script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #1f2937;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 0.75rem 0;
      font-weight: 700;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Gateway Redirect</div>
    <h1>Maria Vulcu</h1>
    <p>DevOps / Cloud Engineer. Redirecting to production hub...</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://grepme.dev">Visit Main Hub (grepme.dev) &rarr;</a>
      <a class="btn btn-secondary" href="https://mvulcu.github.io/devops-portfolio-docs/">Open Documentation Portal &rarr;</a>
      <a class="btn btn-secondary" href="https://github.com/mvulcu">GitHub Profile (@mvulcu) &rarr;</a>
    </div>
  </div>
</body>
</html>
